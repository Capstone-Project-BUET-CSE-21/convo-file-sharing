spring.datasource.url=jdbc:h2:mem:file_sharing_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# test/resources shadows main/resources on the test classpath, so this
# needs its own value — JwtAuthenticationFilter requires app.jwt.secret to
# be present just to construct, even in slices that never exercise auth.
app.jwt.secret=test-only-secret-key-at-least-32-bytes-long
