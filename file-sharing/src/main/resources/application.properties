spring.application.name=file-sharing
server.port=${PORT:8082}

management.endpoints.web.exposure.include=health
spring.datasource.url=${spring-datasource-url}
spring.datasource.username=${spring-datasource-username}
spring.datasource.password=${spring-datasource-password}
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Required settings below have no fallback value, but an EMPTY default (the
# trailing ':') on purpose. With no default at all, Spring binds an unset
# variable as the literal text "${VAR}", which passes the "must be set"
# checks. Empty makes them fail at startup instead.

# Shared secret with convo-backend's AuthService/JwtService — this service only
# verifies tokens issued there, it never issues its own. See JwtProperties.
app.jwt.secret=${JWT_SECRET:}