spring.application.name=file-sharing
server.port=${PORT:8082}
spring.datasource.url=${spring-datasource-url}
spring.datasource.username=${spring-datasource-username}
spring.datasource.password=${spring-datasource-password}
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Shared secret with convo-backend's AuthService/JwtService — this service only
# verifies tokens issued there, it never issues its own.
app.jwt.secret=${JWT_SECRET:replace-with-at-least-32-char-secret-key}